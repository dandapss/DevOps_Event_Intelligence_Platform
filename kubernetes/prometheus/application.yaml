apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default

# for main
#  source:
#    repoURL: https://github.com/dandapss/DevOps_Event_Intelligence_Platform.git
#    targetRevision: dev
#    path: kubernetes/prometheus

# Only for dev
  sources:
    - repoURL: https://github.com/prometheus-community/helm-charts.git
      targetRevision: kube-prometheus-stack-75.8.0
      path: charts/kube-prometheus-stack
      helm:
        valueFiles:
          - $values/kubernetes/prometheus/values.yaml
    - repoURL: https://github.com/dandapss/DevOps_Event_Intelligence_Platform.git
      targetRevision: dev
      ref: values


  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
