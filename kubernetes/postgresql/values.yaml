postgresql:
  auth:
    username: db_user
    database: event_intelligence
    existingSecret: eip-postgresql-auth
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password

  image:
    registry: docker.io
    repository: bitnami/postgresql
    tag: 17.6.0-debian-12-r4

  # Creating VPC for my PostgreSQL
  primary:
    persistence:
      enabled: true
      size: 2Gi
      storageClass: "standard"

    extraVolumes:
      - name: schema
        configMap:
          name: postgres-schema

    extraVolumeMounts:
      - name: schema
        mountPath: /docker-entrypoint-initdb.d
