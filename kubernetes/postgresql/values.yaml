postgresql:
  auth:
    postgresPassword: postgres
    username: db_user
    password: db_password
    database: event_intelligence

  primary:
    persistence:
      enabled: true
      size: 2Gi
      storageClass: postgres-storage

    extraVolumes:
    - name: schema
      configMap:
        name: postgres-schema

    extraVolumeMounts:
    - name: schema
      mountPath: /docker-entrypoint-initdb.d
