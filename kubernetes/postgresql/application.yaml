apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: postgresql
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/dandapss/DevOps_Event_Intelligence_Platform.git
    targetRevision: main
    path: kubernetes/postgresql

  destination:
    server: https://kubernetes.default.svc
    namepsace: database

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
