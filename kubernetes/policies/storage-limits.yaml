# Cap what workloads in this namespace may request.
# This is an admission/request limit; the storage backend must enforce physical capacity.
apiVersion: v1
kind: LimitRange
metadata:
  name: postgres-pvc-limit
  namespace: event-intelligence
spec:
  limits:
    - type: PersistentVolumeClaim
      max:
        # Any single claim larger than this is rejected.
        storage: 2Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: event-intelligence-storage
  namespace: event-intelligence
spec:
  hard:
    # Total requested capacity across claims in this namespace.
    requests.storage: 2Gi
    # Keep one PostgreSQL data claim in the MVP.
    persistentvolumeclaims: "1"
