apiVersion: batch/v1
kind: CronJob

metadata:
  name: news-collector

spec:
  schedule: "*/30 * * * *"

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: news-collector
              image: news-collector
              imagePullPolicy: IfNotPresent

              envFrom:
                - configMapRef:
                    name: news-collector-config

              env:
                - name: DB_USER
                  value: db_user

                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: eip-postgresql-auth
                      key: password

              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop:
                    - ALL
