apiVersion: batch/v1
kind: CronJob

metadata:
  name: news-collector

spec:
  schedule: "*/30 * * * *"

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never

          containers:
            - name: news-collector
              image: news-collector
              imagePullPolicy: IfNotPresent

              envFrom:
                - configMapRef:
                    name: news-collector-config

              env:
                - name: DB_USER
                  value: news

                - name: DB_PASSWORD
                  value: news
