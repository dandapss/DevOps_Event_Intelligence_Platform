apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: news-collector
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dandapss/DevOps_Event_Intelligence_Platform.git
    targetRevision: main
    path: kubernetes/apps/news-collector
  destination:
    server: https://kubernetes.default.svc
    namespace: collector
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
