adminUser: admin

persistence:
  enabled: true

  size: 2Gi

service:
  type: ClusterIP

ingress:
  enabled: false

additionalDataSources:
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgresql.collector.svc.cluster.local:5432
    database: event_intelligence
    user: db_user

    secureJsonData:
      password: db_password

    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
