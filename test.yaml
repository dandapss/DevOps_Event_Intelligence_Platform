# Add this in the CI file today! 

commit-image-tags:
  needs:
    - changes
    - image-build

  if: |
    github.ref == 'refs/heads/main' &&
    needs.image-build.result == 'success'

  permissions:
    contents: write

  runs-on: ubuntu-latest

  steps:
    - uses: actions/checkout@v4

    - name: Update image tags
      run: |
        for image in $(echo '${{ needs.changes.outputs.images }}' | jq -r '.[]'); do
          sed -i \
            "s/^    newTag:.*/    newTag: ${GITHUB_SHA}/" \
            kubernetes/apps/${image}/kustomization.yaml
        done

    - name: Commit and Push image tags
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add kubernetes/apps

        if git diff --cached --quiet; then
          exit 0
        fi

        git commit -m "Update image tags to ${GITHUB_SHA} [skip ci]"
        git push origin HEAD:main
