- name: Install ArgoCD
  hosts: k3s
  become: true

  tasks:
    - name: Add ArgoCD Helm Repo
      kubernetes.core.helm_repository:
        name: argo
        repo_url: https://argoproj.github.io/argo-helm

    - name: Copy ArgoCD Helm values to EC2
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/values.yaml"
        dest: /tmp/argocd-values.yaml
        owner: root
        group: root
        mode: "0600"

    - name: Get pending Helm history
      ansible.builtin.command:
        argv:
          - helm
          - list
          - -A
          - --pending
          - -o
          - json
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: pending_helm
      changed_when: false

    - name: If Exist, uninstall stuck pending Helm release
      ansible.builtin.command:
        argv:
          - helm
          - uninstall
          - "{{ item.name }}"
          - -n
          - "{ item.namespace }}"
      loop: "{{ pending_helm.stdout | from_json }}"
      loop_control:
        label: "{{ item.name }} ({{ item.namespace }})"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      changed_when: true

    - name: Install or upgrade ArgoCD
      kubernetes.core.helm:
        name: argocd
        chart_ref: argo/argo-cd
        release_namespace: argocd
        create_namespace: true
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        values_files:
          - /tmp/argocd-values.yaml
        update_repo_cache: true
        state: present

    - name: Wait for ArgoCD Server
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - deployment
          - argocd-server
          - --namespace
          - argocd
          - -o
          - jsonpath={.status.readyReplicas}
      register: argocd_status
      changed_when: false
      retries: 30
      delay: 10
      until: (argocd_status.stdout | int) >= 1

    - name: Show ArgoCD Status
      ansible.builtin.debug:
        var: argocd_status.stdout
