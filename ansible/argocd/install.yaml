- name: Install ArgoCD
  hosts: k3s
  become: true

  tasks:
    - name: Add ArgoCD Helm Repo
      kubernetes.core.helm_repository:
        name: argo
        repo_url: https://argoproj.github.io/argo-helm

    - name: Copy ArgoCD Helm values to EC2
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/values.yaml"
        dest: /tmp/argocd-values.yaml
        owner: root
        group: root
        mode: "0600"

    - name: Check Helm release status for pending lock
      ansible.builtin.command:
        argv:
          - helm
          - status
          - argocd
          - -n
          - argocd
          - -o
          - json
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: helm_release_status
      failed_when: false
      changed_when: false

    - name: Clean up stuck pending Helm release
      ansible.builtin.command:
        argv:
          - kubectl
          - delete
          - secret
          - -n
          - argocd
          - -l
          - "owner=helm,name=argocd,status in (pending-install,pending-upgrade,pending-rollback)"
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: clean_helm_lock
      changed_when: "'deleted' in clean_helm_lock.stdout"
      when:
        - helm_release_status.rc == 0
        - "'pending-' in helm_release_status.stdout"

    - name: Install or upgrade ArgoCD
      kubernetes.core.helm:
        name: argocd
        chart_ref: argo/argo-cd
        release_namespace: argocd
        create_namespace: true
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        values_files:
          - /tmp/argocd-values.yaml
        update_repo_cache: true
        state: present

    - name: Wait for ArgoCD Server
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - deployment
          - argocd-server
          - --namespace
          - argocd
          - -o
          - jsonpath={.status.readyReplicas}
      register: argocd_status
      changed_when: false
      retries: 30
      delay: 10
      until: (argocd_status.stdout | int) >= 1

    - name: Show ArgoCD Status
      ansible.builtin.debug:
        var: argocd_status.stdout
