- name: Install ArgoCD
  hosts: k3s
  become: true

  tasks:
    - name: Add ArgoCD Helm Repo
      kubernetes.core.helm_repository:
        name: argo
        repo_url: https://argoproj.github.io/argo-helm

    - name: Copy ArgoCD Helm values to EC2
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/argocd/values.yaml"
        dest: /tmp/argocd-values.yaml
        owner: root
        group: root
        mode: "0600"

    - name: Install or upgrade ArgoCD
      kubernetes.core.helm:
        name: argocd
        chart_ref: argo/argo-cd
        release_namespace: argocd
        create_namespace: true
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        values_files:
          - /tmp/argocd-values.yaml
        update_repo_cache: true
        state: present

    - name: Wait for ArgoCD Server
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - deployment
          - argocd-server
          - --namespace
          - argocd
          - -o
          - jsonpath={.status.readyReplicas}
      register: argocd_status
      changed_when: false
      retries: 30
      delay: 10
      until: (argocd_status.stdout | int) >= 1

    - name: Show ArgoCD Status
      ansible.builtin.debug:
        var: argocd_status.stdout
