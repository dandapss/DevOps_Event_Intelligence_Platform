- name: Create PostgreSQL credentials in Kubernetes
  hosts: k3s
  become: true
  gather_facts: false

  tasks: 
  - name: Create collector namespace
    kubernetes.core.k8s:
      kubeconfig: /etc/rancher/k3s/k3s.yaml
      state: present
      definition:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: collector

  - name: Create or update PostgreSQL Secret
    vars:
      postgres_admin_password: >-
        {{ lookup(
          'amazon.aws.ssm_parameter',
          '/eip/prod/postgresql/admin-password',
          region='eu-central-1',
          decrypt=true
          ) }}

      postgres_app_password: >-
        {{ lookup(
          'amazon.aws.ssm_parameter',
          '/eip/prod/postgresql/app-password',
          region='eu-central-1',
          decrypt=true
          ) }}

      kubernetes.core.k8s:
        kubeconfig: /etc/rancher/k3s/k3s.yaml
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: eip-postgresql-auth
            namespace: collector
          type: Opaque
          stringData:
            postgres-password: "{{ postgres_admin_password }}"
            password: "{{ postgres_app_password }}"
      no_log: true
