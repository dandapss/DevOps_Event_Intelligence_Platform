- name: Create PostgreSQL credentials in Kubernetes
  hosts: k3s
  become: true
  gather_facts: false

  tasks: 
  - name: Create collector namespace
    kubernetes.core.k8s:
      kubeconfig: /etc/rancher/k3s/k3s.yaml
      state: present
      definition:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: collector

  - name: Read PostgreSQL "ADMIN" password from AWS Parameter Store
    ansible.builtin.command:
      cmd: >-
        aws ssm get-parameter --name /eip/prod/postgresql/admin-password
        --with-decryption --query Parameter.Value --output text --region eu-central-1
    register: postgres_admin_password
    changed_when: false
    no_log: true

  - name: Read PostgreSQL "APP" password from AWS Parameter Store
    ansible.builtin.command:
      cmd: >-
        aws ssm get-parameter --name /eip/prod/postgresql/app-password
        --with-decryption --query Parameter.Value --output text --region eu-central-1
    register: postgres_app_password
    changed_when: false
    no_log: true

  - name: Create or update PostgreSQL Secret
    kubernetes.core.k8s:
      kubeconfig: /etc/rancher/k3s/k3s.yaml
      state: present
      definition:
        apiVersion: v1
        kind: Secret
        metadata:
          name: eip-postgresql-auth
          namespace: collector
        type: Opaque
        stringData:
          postgres-password: "{{  postgres_admin_password.stdout }}"
          password: "{{ postgres_app_password.stdout }}"
    no_log: true
