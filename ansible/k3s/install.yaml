- name: Install k3s
  hosts: k3s
  become: true

  tasks:
    - name: Create 2GB swap file if not exists
      ansible.builtin.shell: |
        fallocate -| 2G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      args:
        creates: /swapfile

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - curl
          - unzip
          - python3-kubernetes
        state: present
        update_cache: true

    - name: Download AWS CLI v2
      ansible.builtin.unarchive:
        src: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp
        remote_src: true
        creates: /tmp/aws

    - name: Install AWS CLI v2
      ansible.builtin.command:
        cmd: /tmp/aws/install
        creates: /usr/local/bin/aws

    - name: Verify AWS CLI installation
      ansible.builtin.command:
        cmd: aws --version
      register: aws_version
      changed_when: false

    - name: Download k3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"
        force: false

    - name: Install k3s
      ansible.builtin.command:
        argv:
          - /bin/sh
          - /tmp/install-k3s.sh
      environment:
        INSTALL_K3S_EXEC: "server --disable=traefik --disable=servicelb"
      args:
        creates: /etc/rancher/k3s/k3s.yaml

    - name: Start and Enable k3s service
      ansible.builtin.systemd:
        name: k3s
        state: started
        enabled: true

    - name: Wait for node ready
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - nodes
          - --no-headers
      register: node_status
      changed_when: false
      retries: 30
      delay: 5
      until: "'Ready' in node_status.stdout"

    - name: Wait to stabilize
      ansible.builtin.pause:
        seconds: 15

   # Install Helm for next steps
    - name: Download Helm installer
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm-3
        mode: "0755"
        force: false

    - name: Install Helm
      ansible.builtin.command:
        argv:
          - /bin/bash
          - /tmp/get-helm-3
      args:
        creates: /usr/local/bin/helm

    - name: Verify Helm
      ansible.builtin.command: "{{ item }}"
        loop:
          - aws --version
          - kubectl get nodes
          - helm version
        register: verify_out
      changed_when: false

    - name: Show node status
      ansible.builtin.debug:
        msg: "{{ verify_out.results | map(attribute='stdout_lines') | list }}"
