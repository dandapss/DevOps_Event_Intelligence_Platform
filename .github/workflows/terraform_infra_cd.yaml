name: Terraform infra CD

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform

jobs:
  terraform-apply:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/infra

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::236608206962:role/eip-github-actions-terraform
          aws-region: eu-central-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Clear taint markers when present
        shell: bash
        run: |
          for address in \
            aws_iam_role.seob_role \
            aws_s3_bucket.ansible_ssm_transfer \
            aws_vpc.seob_vpc \
            aws_iam_role_policy.postgresql_parameter_read
          do
            if output=$(terraform untaint -no-color "$address" 2>&1); then
              printf '%s\n' "$output"
              continue
            fi

            normalized=$(printf '%s' "$output" | tr '\n' ' ' | tr -s ' ')

            if [[ "$normalized" == *"is not currently tainted"* ]]; then
              echo "$address is already untainted; skipping."
            else
              printf '%s\n' "$output"
              exit 1
            fi
          done

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply --auto-approve

  ansible-cd:
    needs: terraform-apply

    if: |
      github.ref == 'refs/heads/main' &&
      needs.terraform-apply.result == 'success'

    uses: ./.github/workflows/ansible_cd.yaml

