name: Terraform boot CD

on:
  workflow_dispatch:

permissions:
  contents: read
  # Get OIDC Token
  #id-token: write

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  terraform-apply:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/bootstrap

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::236608206962:role/eip-github-actions-terraform
          aws-region: eu-central-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply --auto-approve

---
#ChatGPT Codex
name: Terraform bootstrap CD

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  terraform-apply:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/bootstrap

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::236608206962:role/eip-github-actions-terraform
          aws-region: eu-central-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -out=bootstrap.tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve bootstrap.tfplan
