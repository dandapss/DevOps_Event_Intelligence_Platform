name: Terraform bootstrap initial setup

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/backend

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::236608206962:role/eip-github-actions-terraform
          aws-region: eu-central-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive .

      # Creating S3 Bucket
      - name: Prepare local bootstrap directory
        shell: bash
        run: |
          BOOTSTRAP_DIR="${RUNNER_TEMP}/terraform-backend-bootstrap"
          mkdir -p "$BOOTSTRAP_DIR"

          cp terraform.tf "$BOOTSTRAP_DIR/"
          cp state.tf "$BOOTSTRAP_DIR/"

          if [[ -f terraform/backend/.terraform.lock.hcl ]]; then
            cp .terraform.lock.hcl "$BOOTSTRAP_DIR"
          fi

          echo "BOOTSTRAP_DIR=$BOOTSTRAP_DIR" >> "$GITHUB_ENV"

      - name: Initialize without an S3 backend
        run: terraform -chdir="$BOOTSTRAP_DIR" init -backend=false -input=false

      - name: Terraform validate
        run: terraform -chdir="$BOOTSTRAP_DIR" validate

      - name: Plan bucket creation
        run: terraform -chdir="$BOOTSTRAP_DIR" plan -input=false -out="$BOOTSTRAP_DIR/bootstrap.tfplan"

      - name: Create the state bucket
        run: terraform -chdir="$BOOTSTRAP_DIR" apply -input=false -auto-approve "$BOOTSTRAP_DIR/bootstrap.tfplan"

      - name: Wait for S3 versioning
        run: sleep 30

      - name: Add the S3 backend configuration
        run: cp backend.tf "$BOOTSTRAP_DIR/backend.tf"

      - name: Migrate bootstrap state to S3
        run: terraform -chdir="$BOOTSTRAP_DIR" init -input=false -migrate-state -force-copy

      - name: Verify remote state and configuration
        run: |
          terraform -chdir="$BOOTSTRAP_DIR" state list
          terraform -chdir="$BOOTSTRAP_DIR" plan -input=false
