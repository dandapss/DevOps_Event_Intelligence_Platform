# Last update 25th of November 2026.

name: Event Intelligence Platform CI

on:
  push:
    branches:
      - dev
    paths:
      - 'src/**'
      - 'kubernetes/**'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:

#--------------------#
# Change Check Start #
#--------------------#

  changes:
    runs-on: ubuntu-latest

    outputs:
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      images: ${{ steps.targets.outputs.images }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        name: Check the modified One
        id: filter
        with:
          list-files: json
          filters: |

            kubernetes:
              - 'kubernetes/**'

            images:
              - 'src/*/**'

      - name: Create changed image list
        id: targets
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.images_files }}
        run: |
          images=$(jq -c 'map(split("/")[1]) | unique' <<< "$CHANGED_FILES")
          echo "images=$images" >> "$GITHUB_OUTPUT"

  debug:
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: |
          echo "kubernetes=${{ needs.changes.outputs.kubernetes }}"
          echo "images=${{ needs.changes.outputs.images }}"

      - name: Debug Git
        run: |
          echo "EVENT=${{ github.event_name }}"
          echo "REF=${{ github.ref }}"
          git branch -a
          git log --oneline -5

#------------------#
# Change Check End #
#------------------#


#----------------#
# Validate Start #
#----------------#

  kubernetes-validate:
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Add Helm repositories
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Download Helm dependencies
        run: |
          helm dependency build kubernetes/postgresql
          helm dependency build kubernetes/grafana
          helm dependency build kubernetes/prometheus

      - name: Helm Lint test
        run: |
          helm lint kubernetes/postgresql
          helm lint kubernetes/grafana
          helm lint kubernetes/prometheus

      - name: Helm template test
        run: |
          helm template kubernetes/postgresql > /dev/null
          helm template kubernetes/grafana > /dev/null
          helm template kubernetes/prometheus > /dev/null

      - run: pip install yamllint
        name: Install Yamllint

      - run: yamllint .
        name: Test yamllint

      - name: Kustomize build test
        run: |
          kustomize build kubernetes > /dev/null
          kustomize build kubernetes/apps/news-collector > /dev/null
          kustomize build kubernetes/apps/stock-collector > /dev/null

  image-validate:
    needs: changes
    if: needs.changes.outputs.images != '[]'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images )}}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        working-directory: src/${{ matrix.image }}
        run: python -m compileall -q .

#--------------#
# Validate End #
#--------------#


#---------------------#
# Security Scan Start #
#---------------------#

  security-scan:
    needs:
      - changes
      - kubernetes-validate
      - image-validate

    if: |
      always() &&
      github.ref == 'refs/heads/dev' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy IaC & Config Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

#-------------------#
# Security Scan End #
#-------------------#

 
 # if called ---------#
 # Updating Tag Start #
 #--------------------#

  update-image-tag:
    needs:
      - changes
      - security-scan

    if: |
      github.ref == 'refs/heads/dev' &&
      needs.security-scan.result == 'success' &&
      needs.changes.outputs.images != '[]'

    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update image tag
        run: |
          for image in $(echo '${{ needs.changes.outputs.images }}' | jq -r '.[]'); do
            sed -i \
              "s/^    newTag:.*/    newTag: ${GITHUB_SHA}/" \
              kubernetes/apps/${image}/kustomization.yaml
          done

      - name: Commit and Push image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/apps

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update image tags to ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:main

 #------------------#
 # Updating Tag End #
 #------------------#
