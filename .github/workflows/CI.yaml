name: Event Intelligence Platform CI

on:
#  push:
#    branches:
#      - main
#    paths:
#      - 'src/news-collector/**'
#      - 'src/stock-collector/**'
#      - 'terraform/**'
#      - 'ansible/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:

#--------------------#
# Change Check Start #
#--------------------#
  
  changes:
    runs-on: ubuntu-latest

    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      ansible: ${{ steps.filter.outputs.ansible }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      images: ${{ steps.targets.outputs.images }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: main
          list-files: json
          filters: |
            terraform:
              - 'terraform/**'

            ansible:
              - 'ansible/**'

            kubernetes:
              - 'kubernetes/**'

            images:
              - 'src/*/**'

      - name: Create changed image list
        id: targets
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.images_files }}
        run: |
          images=$(jq -c 'map(split("/")[1]) | unique' <<< "$CHANGED_FILES")
          echo "images=$images" >> "$GITHUB_OUTPUT"

  debug:
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - run: |
          echo "terraform=${{ needs.changes.outputs.terraform }}"
          echo "ansible=${{ needs.changes.outputs.ansible }}"
          echo "kubernetes=${{ needs.changes.outputs.kubernetes }}"
          echo "images=${{ needs.changes.outputs.images }}"

#------------------#
# Change Check End #
#------------------#


#----------------#
# Validate Start #
#----------------#

  terraform-validate:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform fmt -check -recursive

      - run: terraform init -backend=false

      - run: terraform validate

  ansible-validate:
    needs: changes
    if: needs.changes.outputs.ansible == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: pip install ansible ansible-lint

      - run: ansible-lint

      - run: |
          find ansible -name "*.yml" -o -name "*.yaml"

  kubernetes-validate:
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Download Helm dependencies
        run: |
          helm dependency build kubernetes/postgresql
          helm dependency build kubernetes/grafana
          helm dependency build kubernetes/prometheus

      - run: |
          helm lint kubernetes/postgresql
          helm lint kubernetes/grafana
          helm lint kubernetes/prometheus

      - run: |
          helm template kubernetes/postgresql > /dev/null
          helm template kubernetes/grafana > /dev/null
          helm template kubernetes/prometheus > /dev/null

      - run: pip install yamllint

      - run: yamllint .

      - run: |
          kustomize build kubernetes/apps/news-collector > /dev/null
          kustomize build kubernetes/apps/stock-collector > /dev/null

  image-validate:
    needs: changes
    if: needs.changes.outputs.images != '[]'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images )}}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        working-directory: src/${{ matrix.image }}
        run: python -m compileall -q .

#--------------#
# Validate End #
#--------------#


 # if called ---------#
 # Terraform CD Start #
 #--------------------#

  terraform-cd:
    needs:
      - changes
      - terraform-validate

    if: |
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.terraform == 'true' &&
      needs.terraform-validate.result == 'success'

    uses: ./.github/workflows/terraform_cd.yaml

 #------------------#
 # Terraform CD End #
 #------------------#


 # if called ---------#
 # Docker Build Start #
 #--------------------#

  image-build:
    needs:
      - changes
      - image-validate

    if: needs.changes.outputs.images != '[]' && needs.image-validate.result == 'success'
    permissions:
      packages: write
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}

    env:
      IMAGE_NAME: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
          -t "ghcr.io/dandapss/eip/${IMAGE_NAME}:${GITHUB_SHA}" \
          -t "ghcr.io/dandapss/eip/${IMAGE_NAME}:latest" "src/${IMAGE_NAME}"

      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-actions@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Images
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/dandapss/eip/${IMAGE_NAME}:${GITHUB_SHA}
          docker push ghcr.io/dandapss/eip/${IMAGE_NAME}:latest

 #------------------#
 # Docker Build End #
 #------------------#


 # if called ---------#
 # Updating Tag Start #
 #--------------------#

  update-image-tag:
    needs:
      - changes
      - image-build
    if: github.ref == 'refs/heads/main' && needs.image-build.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}

    env:
      IMAGE_NAME: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Update image tag
        run: |
          sed -i "s/^    newTag:.*/    newTag: ${GITHUB_SHA}/" kubernetes/apps/${IMAGE_NAME}/kustomization.yaml

      - name: Commit and Push image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/apps/${IMAGE_NAME}/kustomization.yaml

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update image tag to ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:main


 #------------------#
 # Updating Tag End #
 #------------------#
