# Last update 10th of November 2026.

name: Event Intelligence Platform CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'kubernetes/**'
      - 'terraform/**'
      - 'ansible/**'
      - '.github/workflows/CI.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:

#--------------------#
# Change Check Start #
#--------------------#

  changes:
    runs-on: ubuntu-latest

    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
      ansible: ${{ steps.filter.outputs.ansible }}
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      images: ${{ steps.targets.outputs.images }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        name: Check the modified One
        id: filter
        with:
          list-files: json
          filters: |
            terraform:
              - 'terraform/**'

            ansible:
              - 'ansible/**'

            kubernetes:
              - 'kubernetes/**'

            images:
              - 'src/*/**'

      - name: Create changed image list
        id: targets
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.images_files }}
        run: |
          images=$(jq -c 'map(split("/")[1]) | unique' <<< "$CHANGED_FILES")
          echo "images=$images" >> "$GITHUB_OUTPUT"

  debug:
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: |
          echo "terraform=${{ needs.changes.outputs.terraform }}"
          echo "ansible=${{ needs.changes.outputs.ansible }}"
          echo "kubernetes=${{ needs.changes.outputs.kubernetes }}"
          echo "images=${{ needs.changes.outputs.images }}"

      - name: Debug Git
        run: |
          echo "EVENT=${{ github.event_name }}"
          echo "REF=${{ github.ref }}"
          git branch -a
          git log --oneline -5

#------------------#
# Change Check End #
#------------------#


#----------------#
# Validate Start #
#----------------#

  terraform-validate:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform fmt -check -recursive
        name: Terraform format check

      - run: terraform init -backend=false
        name: Terraform init check

      - run: terraform validate
        name: Terraform validate

  ansible-validate:
    needs: changes
    if: needs.changes.outputs.ansible == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: pip install ansible ansible-lint

      - run: ansible-lint

      - run: |
          find ansible -name "*.yml" -o -name "*.yaml"

  kubernetes-validate:
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Download Helm dependencies
        run: |
          helm dependency build kubernetes/postgresql
          helm dependency build kubernetes/grafana
          helm dependency build kubernetes/prometheus

      - name: Helm Lint test
        run: |
          helm lint kubernetes/postgresql
          helm lint kubernetes/grafana
          helm lint kubernetes/prometheus

      - name: Helm template test
        run: |
          helm template kubernetes/postgresql > /dev/null
          helm template kubernetes/grafana > /dev/null
          helm template kubernetes/prometheus > /dev/null

      - run: pip install yamllint
        name: Install Yamllint

      - run: yamllint .
        name: Test yamllint

      - name: Kustomize build test
        run: |
          kustomize build kubernetes/apps/news-collector > /dev/null
          kustomize build kubernetes/apps/stock-collector > /dev/null

  image-validate:
    needs: changes
    if: needs.changes.outputs.images != '[]'

    runs-on: ubuntu-latest

    strategy:
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images )}}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        working-directory: src/${{ matrix.image }}
        run: python -m compileall -q .

#--------------#
# Validate End #
#--------------#


 # if called ---------#
 # Terraform CD Start #
 #--------------------#

  terraform-cd:
    needs:
      - changes
      - terraform-validate

    if: |
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.terraform == 'true' &&
      needs.terraform-validate.result == 'success'

    uses: ./.github/workflows/terraform_cd.yaml

 #------------------#
 # Terraform CD End #
 #------------------#


 # if called ---------#
 # Docker Build Start #
 #--------------------#

  image-build:
    needs:
      - changes
      - image-validate

    if: needs.changes.outputs.images != '[]' && needs.image-validate.result == 'success'
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}

    env:
      IMAGE_NAME: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
          -t "ghcr.io/dandapss/eip/${IMAGE_NAME}:${GITHUB_SHA}" \
          -t "ghcr.io/dandapss/eip/${IMAGE_NAME}:latest" "src/${IMAGE_NAME}"

      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Images
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/dandapss/eip/${IMAGE_NAME}:${GITHUB_SHA}
          docker push ghcr.io/dandapss/eip/${IMAGE_NAME}:latest

 #------------------#
 # Docker Build End #
 #------------------#


 # if called ---------#
 # Updating Tag Start #
 #--------------------#

  update-image-tag:
    needs:
      - changes
      - image-build
    if: github.ref == 'refs/heads/main' && needs.image-build.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update image tag
        run: |
          for image in $(echo '${{ needs.changes.outputs.images }}' | jq -r '.[]'); do
            sed -i \
              "s/^    newTag:.*/    newTag: ${GITHUB_SHA}/" \
              kubernetes/apps/${image}/kustomization.yaml
          done

      - name: Commit and Push image tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/apps

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update image tags to ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:main

 #------------------#
 # Updating Tag End #
 #------------------#
