# Last update on 19th Nov. 2026
name: Ansible CD

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ansible

jobs:
  ansible-run:
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: ansible

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::236608206962:role/eip-github-actions-terraform
          aws-region: eu-central-1

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core boto3 botocore
          ansible-galaxy collection install amazon.aws kubernetes.core

      - name: Install AWS Session Manager plugin
        run: |
          curl -fsSL \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version

      - uses: hashicorp/setup-terraform@v3

      - name: Get Terraform Outputs
        working-directory: terraform/infra
        run: |
          terraform init
          echo "INSTANCE_ID=$(terraform output -raw instance_id)" >> $GITHUB_ENV

      - name: Generate Inventory
        run: |
          cat > inventory.ini <<EOF
          [k3s]
          $INSTANCE_ID

          [k3s:vars]
          ansible_connection=amazon.aws.aws_ssm
          ansible_aws_ssm_region=eu-central-1
          ansible_aws_ssm_bucket_name=eip-ansible-ssm-transfer-236608206962-eu-central-1
          ansible_aws_ssm_timeout=600
          EOF

      - name: Verify SSM connectivity
        run: |
          ansible -i inventory.ini k3s -m ping -vvvv

      - name: Run Ansible
        run: |
          ansible-playbook -i inventory.ini site.yaml
