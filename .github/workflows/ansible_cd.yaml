# Last update on 19th Nov. 2026
name: Ansible CD

on:
  workflow_call:

permissions:
  contents: read
# It will be enabled when aws is setup
  # id-toekn: write

concurrency:
  group: ansible

jobs:
  ansible-run:
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: ansible

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::236608206962:role/eip-github-actions-terraform
          aws-region: eu-central-1

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible boto3 botocore 
          ansible-galaxy collection install amazon.aws

      - name: Get Terraform Outputs
        working-directory: terraform/infra
        run: |
          terraform init
          echo "INSTANCE_ID=$(terraform output -raw instance_id)" >> $GITHUB_ENV

      - name: Generate Inventory
        run: |
          cat > inventory.ini <<EOF
          [k3s]
          $INSTANCE_ID

          [k3s:vars]
          ansible_connection=aws_ssm
          ansible_region=eu-central-1
          EOF

      - name: Run Ansible
        run: |
          ansible-playbook -i inventory.ini site.yaml
