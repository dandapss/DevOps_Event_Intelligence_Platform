# Example values for local testing only; this does not trigger trades.
watchlist:
  - symbol: "AAPL"
    currency: "USD"
    # Notify when the observed percentage change is at or below this value.
    price_drop_threshold_percent: -5.0
    # Use simple keyword matching first; sentiment analysis is deferred.
    news_keywords:
      - "earnings"
      - "guidance"

  - symbol: "MSFT"
    currency: "USD"
    price_drop_threshold_percent: -4.0
    news_keywords:
      - "earnings"
